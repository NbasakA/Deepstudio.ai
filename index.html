<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deepstudio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="./Assets/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+JP:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <nav>
            <div class="navbar--logo">
                <img src="./Assets/Logo.png" alt="logo">
                <a href="#">deepstudio</a>
            </div>
            <div class="navbar--links">
                <a href="#">What we do</a>
                <a href="#">About</a>
                <a href="#">Projects</a>
            </div>
            <div>
                <button class="btn--src"><img src="./Assets/src.svg" alt="search icon"></button>
                <button class="btn--primary">Contact</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero-context">
            <div>
                <div>
                    <h1>Amplify Your Brand’s Social Impact</h1>
                    <p>We create compelling social media strategies that drive
                        engagement, build communities, and accelerate your business
                        growth across all platforms.</p>
                    <div>
                        <button>Get Started Now</button>
                        <button>Check Our Work</button>
                    </div>
                    <div>
                        <div>
                            <div>500+</div>
                            <div>Brands Grown</div>
                        </div>
                        <div>
                            <div>2M+</div>
                            <div>Followers Generated</div>
                        </div>
                        <div>
                            <div>98%</div>
                            <div>Client Retention</div>
                        </div>
                    </div>
                </div>
                <div>
                    <img class="hero-photo" src="./Assets/hero-photo.svg" alt="a photo of one of the team members">
                </div>

            </div>

        </section>
    </main>

    
</body>
</html>
